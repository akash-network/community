name: Assign team on label

on:
  issues:
    types: [labeled]

jobs:
  notify-team:
    if: contains(github.event.label.name, 'Provider Audit')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment to notify team
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Please review this Provider Audit request. @akash-network/codeowners-devops'
            })
